<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0f172a"/>
  <!-- Gold accent bar -->
  <rect x="6" y="24" width="20" height="2.5" rx="1.25" fill="#D4AF37"/>
  <!-- Hotel building silhouette -->
  <rect x="10" y="10" width="12" height="14" rx="1" fill="none" stroke="#D4AF37" stroke-width="1.4"/>
  <!-- Roof peak -->
  <polyline points="8,11 16,5 24,11" fill="none" stroke="#D4AF37" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Door -->
  <rect x="14" y="18" width="4" height="6" rx="1" fill="#D4AF37" opacity="0.8"/>
  <!-- Windows -->
  <rect x="11.5" y="12.5" width="2.5" height="2.5" rx="0.4" fill="#D4AF37" opacity="0.6"/>
  <rect x="18" y="12.5" width="2.5" height="2.5" rx="0.4" fill="#D4AF37" opacity="0.6"/>
</svg>
